[workspace]
resolver = "3"
members = ["engine", "kernels", "platform", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 1
overflow-checks = true
debug-assertions = true

[profile.dev]
overflow-checks = true
debug-assertions = true
